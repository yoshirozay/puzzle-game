<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <rect x="18" y="16" width="60" height="62" rx="12" fill="#1B1613" fill-opacity="0.85"/>
  <!-- Glyph centred on y=47, the inner panel's optical centre (panel spans
       y 16-78) — at 48 the sun sat one unit low beside the torch's beam. -->
  <g transform="translate(48 47) scale(0.72) translate(-48 -48)">
  <g transform="translate(48 48)">
    <!-- wavefront ring first, so the rays pierce it -->
    <g>
      <path d="M-16.5 -28.58 A33 33 0 0 1 16.5 -28.58 L13.5 -23.38 A27 27 0 0 0 -13.5 -23.38 Z" fill="#FFF6E4"/>
    </g>
    <g transform="rotate(90)">
      <path d="M-16.5 -28.58 A33 33 0 0 1 16.5 -28.58 L13.5 -23.38 A27 27 0 0 0 -13.5 -23.38 Z" fill="#FFF6E4"/>
    </g>
    <g transform="rotate(180)">
      <path d="M-16.5 -28.58 A33 33 0 0 1 16.5 -28.58 L13.5 -23.38 A27 27 0 0 0 -13.5 -23.38 Z" fill="#FFF6E4"/>
    </g>
    <g transform="rotate(270)">
      <path d="M-16.5 -28.58 A33 33 0 0 1 16.5 -28.58 L13.5 -23.38 A27 27 0 0 0 -13.5 -23.38 Z" fill="#FFF6E4"/>
    </g>
    <!-- diagonal rays, solid, short -->
    <polygon points="0,-26 6,-12 -6,-12" fill="#E8B450" transform="rotate(45)"/>
    <polygon points="0,-26 6,-12 -6,-12" fill="#E8B450" transform="rotate(135)"/>
    <polygon points="0,-26 6,-12 -6,-12" fill="#E8B450" transform="rotate(225)"/>
    <polygon points="0,-26 6,-12 -6,-12" fill="#E8B450" transform="rotate(315)"/>
    <!-- cardinal rays, solid, carved with a short inner slit only -->
    <g>
      <polygon points="0,-36 6,-13 -6,-13" fill="#E8B450"/>
      <polygon points="0,-18 1.5,-13 -1.5,-13" fill="#1B1613"/>
    </g>
    <g transform="rotate(90)">
      <polygon points="0,-36 6,-13 -6,-13" fill="#E8B450"/>
      <polygon points="0,-18 1.5,-13 -1.5,-13" fill="#1B1613"/>
    </g>
    <g transform="rotate(180)">
      <polygon points="0,-36 6,-13 -6,-13" fill="#E8B450"/>
      <polygon points="0,-18 1.5,-13 -1.5,-13" fill="#1B1613"/>
    </g>
    <g transform="rotate(270)">
      <polygon points="0,-36 6,-13 -6,-13" fill="#E8B450"/>
      <polygon points="0,-18 1.5,-13 -1.5,-13" fill="#1B1613"/>
    </g>
    <!-- the sun's core -->
    <circle r="11" fill="#E86B4A"/>
    <circle r="4.5" fill="#FFF6E4"/>
  </g>
</g>
</svg>