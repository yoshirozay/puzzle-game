name: TikiGames
options:
  bundleIdPrefix: com.example.tikilounge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "26"

packages:
  GameAnalytics:
    url: https://github.com/GameAnalytics/GA-SDK-IOS
    from: "4.11.0"

targets:
  TikiGames:
    type: application
    platform: iOS
    sources:
      - path: TikiGames
    # Carries the GameAnalytics key pair in from the gitignored
    # Secrets.xcconfig — see the comments in Config.xcconfig.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      - package: GameAnalytics
      # GA ships as a binary framework with C++ inside; SPM doesn't carry
      # its linker deps (the CocoaPod declares them), so link libc++ here.
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_NAME: "Tiki Lounge"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tikilounge
        DEVELOPMENT_TEAM: YOURTEAMID
        CODE_SIGN_STYLE: Automatic
        # Game Center (leaderboards). Pair with the capability + per-game
        # leaderboard IDs in App Store Connect — see GameCenter.swift.
        CODE_SIGN_ENTITLEMENTS: TikiGames.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "Tiki Lounge"
        GENERATE_INFOPLIST_FILE: YES
        # Stub plist carrying only the GameAnalytics keys (INFOPLIST_KEY_*
        # can't pass arbitrary names through). Generated keys merge into it.
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: TKSunsetCoral
        TARGETED_DEVICE_FAMILY: "1"

  TikiGamesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TikiGamesTests
    dependencies:
      - target: TikiGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tikilounge.tests
        GENERATE_INFOPLIST_FILE: YES
        # App product is renamed "Tiki Lounge"; XcodeGen would otherwise
        # derive TEST_HOST from the target name (TikiGames.app) and fail.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tiki Lounge.app/Tiki Lounge"
        BUNDLE_LOADER: "$(TEST_HOST)"

  LevelForge:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    # Sources: cherry-pick the pure-Swift engine files from the iOS target
    # (LuauView / LuauSelfTest etc. import SwiftUI or are DEBUG-only and
    # aren't needed here). Plus the tool's own sources under tools/.
    sources:
      - path: TikiGames/LuauGame.swift
      - path: TikiGames/LuauLevel.swift
      - path: TikiGames/LuauLevels.swift
      - path: TikiGames/LuauLevels.hand.swift
      - path: TikiGames/LuauLevels.generated.swift
      - path: TikiGames/LuauBot.swift
      - path: TikiGames/RunSummary.swift
      - path: tools/LevelForge
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: "levelforge"

schemes:
  TikiGames:
    build:
      targets:
        TikiGames: all
        TikiGamesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # Authoritative kill-switch for analytics during tests. The xctest
      # bundle lives inside the app, so Bundle.main resolves GAGameKey and
      # the suite would otherwise write to the live GA account.
      environmentVariables:
        TIKI_DISABLE_ANALYTICS: "1"
      targets:
        - TikiGamesTests
    archive:
      config: Release
